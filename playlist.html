<!DOCTYPE html>

</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">

    <div class="logo">🎵 MusicQuest</div>

    <ul class="nav-links">
      <li><a href="index.html">⌂ Home</a></li>

<section class="hero">
  <h1>Playlist Generator</h1>
  <p>Find music based on your preferences</p>
</section>

<section class="playlist-controls">

  <label>Search By:</label>
  <select id="searchType">
    <option value="genre">Genre</option>
    <option value="artist">Artist</option>
  </select>

  <input type="text" id="searchInput" placeholder="Enter genre or artist">

  <button onclick="generatePlaylist()">Generate Playlist</button>

</section>

<section id="playlistResults">
  <h2>Your Playlist</h2>
  <div id="playlist"></div>
</section>

<script src="js/songs.js"></script>

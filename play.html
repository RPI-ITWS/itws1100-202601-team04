<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Play Game - MusicQuest</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="top-nav">
  <div class="nav-inner">

    <div class="logo">🎵 MusicQuest</div>

    <ul class="nav-links">
      <li><a href="index.html">⌂ Home</a></li>
      <li><a class="active" href="play.html">▷ Play Game</a></li>
      <li><a href="playlist.html">☰ Playlist</a></li>
      <li><a href="scoreboard.html">🏆 Scoreboard</a></li>
    </ul>

  </div>
</nav>

<section class="hero">
  <h1>Choose Your Difficulty</h1>
  <p>How well do you know your music genres?</p>
</section>

<section class="features">

  <div class="card">
    <h3>Easy</h3>
    <p>3 genres - Beginner friendly</p>
    <button onclick="startGame('easy')">Play Easy</button>
  </div>

  <div class="card">
    <h3>Medium</h3>
    <p>6 genres - Balanced challenge</p>
    <button onclick="startGame('medium')">Play Medium</button>
  </div>

  <div class="card">
    <h3>Hard</h3>
    <p>All genres - Expert level</p>
    <button onclick="startGame('hard')">Play Hard</button>
  </div>

</section>
<section id="gameSection" class="game" style="display: none;">

  <h2>Guess the Genre</h2>

  <img id="cover" width="200">

  <div id="options"></div>

  <p id="result"></p>
  <p>Score: <span id="score">0</span></p>

  <button onclick="nextRound()">Next</button>

</section>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/game.js"></script>
<script src="js/script.js"></script>

</body>
</html>
